<div class="dashboard-shell" [class.sidebar-open]="sidebarOpen">
  <header class="topbar">
    <div class="brand-section">
      <button
        type="button"
        class="menu-button"
        aria-label="Toggle sidebar"
        (click)="toggleSidebar()"
      >
        <span class="material-symbols-outlined">menu</span>
      </button>
      <div class="brand-text">
        <p class="eyebrow">associate software engineer</p>
        <h1>B. M. Sharier Kabir</h1>
      </div>
    </div>

  </header>

  <aside class="sidebar" aria-label="Primary navigation">
    <div class="sidebar-brand">
      <span class="logo-mark material-symbols-outlined" aria-hidden="true">code</span>
      <div>
        <p class="eyebrow">portfolio</p>
        <h2>DASHBOARD</h2>
      </div>
    </div>

    <!-- <p class="sidebar-copy">
      Java and Spring Boot engineer with hands-on microservices and full-stack Angular delivery.
    </p> -->

    <nav>
      @for (item of navItems; track item.label) {
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="nav-item"
          (click)="closeSidebarOnMobile()"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- <div class="social-links" aria-label="Social links">
      <a href="https://github.com/himusharier" target="_blank" rel="noreferrer">GitHub</a>
      <a href="https://himusharier.site" target="_blank" rel="noreferrer">Website</a>
      <a href="https://quizfusion.himusharier.me/" target="_blank" rel="noreferrer">QuizFusion</a>
    </div> -->
  </aside>

  <button
    type="button"
    class="overlay"
    aria-label="Close sidebar"
    (click)="toggleSidebar()"
  ></button>

  <main class="content-area">
    <section class="content-card">
      <router-outlet></router-outlet>
    </section>
  </main>
</div>
